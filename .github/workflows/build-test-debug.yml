name: Build & Test Debug

on:
  push:
    branches: [master, staging, stable]
  merge_group:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [master, staging, stable]

env:
  DOTNET_VERSION: 10.0.110
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & Content.Tests
    if: github.actor != 'Erida-change-bot' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout Master
        uses: actions/checkout@v7.0.0

      - name: Setup Submodule
        run: |
          git submodule update --init --recursive

      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5

      - name: Update Engine Submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build --configuration DebugOpt --no-restore /m

      - name: Run Content.Tests
        shell: bash
        run: >
          dotnet test --no-build --configuration DebugOpt
          Content.Tests/Content.Tests.csproj
          --
          NUnit.ConsoleOut=0
          NUnit.TestOutputXml=logs
          NUnit.WorkDirectory="$(pwd)/test_results/content-tests"

      - name: Archive NUnit3 Content.Tests results.
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nunit3-results-content-tests-${{ matrix.os }}
          path: test_results/content-tests/*
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: Upload build output
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-output-${{ matrix.os }}
          path: |
            **/bin/**
            **/obj/**
          retention-days: 1
          compression-level: 1

  integration-tests:
    name: Content.IntegrationTests (${{ matrix.shard }})
    needs: build
    if: github.actor != 'Erida-change-bot' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        shard:
          - core-systems
          - content-construction
          - maps-load
          - maps-systems
          - game-rules
          - round-admin-db
          - entity-core
          - entity-damage
          - entity-systems
          - misc

    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout Master
        uses: actions/checkout@v7.0.0

      - name: Setup Submodule
        run: |
          git submodule update --init --recursive

      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5

      - name: Update Engine Submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install dependencies
        run: dotnet restore

      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: build-output-${{ matrix.os }}

      - name: Run Content.IntegrationTests shard
        shell: bash
        run: |
          export DOTNET_gcServer=1
          mkdir -p "test_results/integration-${{ matrix.shard }}"
          dotnet test Content.IntegrationTests/Content.IntegrationTests.csproj \
            --configuration DebugOpt \
            --no-build \
            --blame-hang-timeout 10min \
            --blame-crash \
            -p:IntegrationTestShard="${{ matrix.shard }}" \
            -m:2 /nr:false \
            -- \
            NUnit.ConsoleOut=0 \
            NUnit.MapWarningTo=Failed \
            NUnit.TestOutputXml=logs \
            NUnit.WorkDirectory="$(pwd)/test_results/integration-${{ matrix.shard }}"

      - name: Archive NUnit3 integration results.
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nunit3-results-integration-${{ matrix.shard }}-${{ matrix.os }}
          path: test_results/integration-${{ matrix.shard }}/*
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

  ci-success:
    name: Build & Test Debug
    needs:
      - build
      - integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: exit 0
