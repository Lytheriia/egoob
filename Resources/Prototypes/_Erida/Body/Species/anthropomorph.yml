- type: entity
  save: false
  name: Urist McAnthropomorph
  parent: BaseMobSpeciesOrganic
  id: MobAnthropomorph
  components:
  - type: HumanoidAppearance
    species: Anthropomorph
    hideLayersOnEquip:
    - Snout
    - HeadTop
    - HeadSide
  - type: Hunger
  - type: Puller
    needsHands: false
  - type: Thirst
  - type: Icon
    sprite: _Orion/Mobs/Species/Anthropomorph/parts.rsi
    state: full
  - type: Body
    prototype: Anthropomorph
    requiredLegs: 2
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: Inventory
    speciesId: vulpkanin
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Corvax/Mobs/Species/Vulpkanin/displacement.rsi # Corvax vulpkanins
            state: jumpsuit
      outerClothing:
        sizeMaps:
          32:
            sprite: _Corvax/Mobs/Species/Vulpkanin/displacement.rsi # Corvax vulpkanins
            state: outerwear
      shoes:
        sizeMaps:
          32:
            sprite: _Corvax/Mobs/Species/Vulpkanin/displacement.rsi # Corvax vulpkanins
            state: shoes
      head:
        sizeMaps:
          32:
            sprite: _Corvax/Mobs/Species/Vulpkanin/displacement.rsi # Corvax vulpkanins
            state: head
      socks:
        sizeMaps:
          32:
            sprite: _Corvax/Mobs/Species/Vulpkanin/displacement.rsi # Corvax vulpkanins
            state: shoes
  - type: Vocal
    sounds:
      Male: MaleHuman
      Female: FemaleHuman
      Unsexed: MaleHuman
  - type: MeleeWeapon
    hidden: true
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: LanguageKnowledge #backmen: languages
    speaks:
    - TauCetiBasic
    understands:
    - TauCetiBasic

