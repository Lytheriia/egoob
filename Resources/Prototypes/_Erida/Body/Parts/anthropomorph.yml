- type: entity
  id: PartAnthropomorph
  parent: [BaseItem, BasePart]
  name: "anthropomorph body part"
  abstract: true
  components:
  - type: BodyPart
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: ChestAnthropomorph
  parent: [PartAnthropomorph, BaseChest]
  name: "anthropomorph chest"
  components:
  - type: Sprite
    sprite: _Orion/Mobs/Species/Anthropomorph/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

- type: entity
