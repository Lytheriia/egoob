- type: entity
  abstract: true
  id: BaseHalloweenTriangleDecoration
  parent: BaseStructure
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: Pullable
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: DecorHalloweenTriangleHPHW1
  parent: BaseHalloweenTriangleDecoration
  name: Happy Halloween bunting 1
  description: Triangular Halloween bunting for decorating the station.
  components:
  - type: Sprite
    sprite: /Textures/_ADT/Holidays/triangles_halloween.rsi
    state: HPHW1

