- type: entity
  abstract: true
  id: BaseHolidayDecoration
  parent: BaseStructure
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: Pullable
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ItemToggle
    activated: false
    onActivate: true
  - type: ItemTogglePointLight
  - type: PointLight
    enabled: false
    radius: 5
    energy: 0.85
    softness: 1.7
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        lights_on:
          True: { visible: true }
          False: { visible: false }

- type: entity
  abstract: true
  id: BaseGarlandDecoration
  parent: BaseHolidayDecoration
  components:
  - type: Physics
    canCollide: false
  - type: PointLight
    enabled: false
    radius: 5
    energy: 0.9
    softness: 1.7
    color: "#ffd98a"

- type: entity
  abstract: true
  id: BasePumpkinDecoration
  parent: BaseHolidayDecoration
  components:
  - type: PointLight
    enabled: false
    radius: 4
    energy: 1
    softness: 1.7
    color: "#ffb347"

- type: entity
  id: DecorGarland1
  parent: BaseGarlandDecoration
  name: Starfall garland
  description: A festive garland. Click it to switch the lights on or off.
  components:
  - type: Sprite
    sprite: /Textures/_Erida/Holidays/halloween/pumkins.rsi
    layers:
    - state: garland_1
    - state: garland_1_lights
    - state: garland_1_on
      map: [ "lights_on" ]
      visible: false
      shader: unshaded

