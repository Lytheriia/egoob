- type: entity
  id: PdaPainter
  name: pda painter
  description: A painting machine for PDAs and ID cards. Insert the item and choose a preset.
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  components:
  - type: Sprite
    sprite: _Erida/Structures/Machines/pda.rsi
    layers:
    - state: pdapainter
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: PdaPainter
    pdaSlot:
      name: pda-painter-slot-pda
      whitelist:
        components:
        - Pda
    cardSlot:
      name: pda-painter-slot-card
      whitelist:
        components:
        - IdCard
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      PdaPainter-pdaSlot: !type:ContainerSlot
      PdaPainter-cardSlot: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: ActivatableUI
    key: enum.PdaPainterUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PdaPainterUiKey.Key:
        type: PdaPainterBoundUserInterface
  - type: ActivatableUIRequiresPower
  - type: ActivatableUIRequiresAccess
  - type: Machine
    board: PdaPainterCircuitboard
  - type: AccessReader
    access: [["Captain"], ["HeadOfPersonnel"]]

- type: entity
  id: PdaPainterCircuitboard
  parent: BaseMachineCircuitboard
  name: pda painter machine board
  description: A machine printed circuit board for a pda painter.
  components:
    - type: MachineBoard
      prototype: PdaPainter
      stackRequirements:
        Manipulator: 2
        Steel: 1
        Glass: 1

- type: entity
  parent: BaseFlatpack
  id: PdaPainterFlatpack
  name: Pda Painter Flatpack
  description: A flatpack used for constructing a pda painter
  components:
  - type: Flatpack
    entity: PdaPainter
